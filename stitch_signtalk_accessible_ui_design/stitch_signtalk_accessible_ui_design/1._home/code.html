<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>SignTalk - Home</title>
<!-- Tailwind CSS CDN with forms and container-queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appBg: '#F5F5F7',
            primaryBlue: '#007AFF',
            primaryText: '#1D1D1F',
            secondaryText: '#6E6E73',
            cardBorder: '#E5E5EA',
            iconPurpleBg: '#ECE7FE',
            iconPurple: '#6842ED'
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          boxShadow: {
            card: '0 2px 8px rgba(0, 0, 0, 0.04)',
          }
        }
      }
    }
  </script>
<!-- Google Font: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style data-purpose="base-styling">
    body {
      background-color: #E5E5EA;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Mobile frame container */
    .mobile-screen {
      width: 100%;
      max-width: 390px;
      min-height: 844px;
      background-color: #F5F5F7;
    }
    /* Custom scrollbar concealment */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:py-6">
<!-- BEGIN: MobileFrame -->
<main class="mobile-screen flex flex-col justify-between shadow-2xl relative overflow-hidden sm:rounded-[44px] border-0 sm:border-[8px] sm:border-gray-800" data-purpose="ios-frame">
<div class="flex-1 flex flex-col overflow-y-auto hide-scrollbar pb-24">
<!-- BEGIN: StatusBar -->
<section class="w-full pt-3 px-7 pb-2 flex justify-between items-center text-primaryText" data-purpose="status-bar">
<!-- Time -->
<span class="text-[15px] font-semibold tracking-tight">9:41</span>
<!-- Status Icons (Cellular, Wifi, Battery) -->
<div class="flex items-center space-x-1.5">
<!-- Signal Icon -->
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<path d="M2 17h3v4H2v-4zm5-4h3v8H7v-8zm5-4h3v12h-3V9zm5-4h3v16h-3V5z"></path>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<path d="M12 4c4.3 0 8.2 1.7 11.1 4.5l-2.1 2.1C18.6 8.4 15.5 7 12 7s-6.6 1.4-9 3.6L.9 8.5C3.8 5.7 7.7 4 12 4zm0 6c2.8 0 5.4 1.1 7.3 2.9l-2.1 2.1C15.8 13.8 14 13 12 13s-3.8.8-5.2 2.1L4.7 13C6.6 11.1 9.2 10 12 10zm0 6c1.4 0 2.6.6 3.5 1.5L12 21.1 8.5 17.5c.9-.9 2.1-1.5 3.5-1.5z"></path>
</svg>
<!-- Battery Icon -->
<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
<path d="M17 6H4c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h13c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H4V8h13v8zm4-7h-1v6h1c.6 0 1-.4 1-1V10c0-.6-.4-1-1-1z"></path>
</svg>
</div>
</section>
<!-- END: StatusBar -->
<!-- BEGIN: Header -->
<header class="px-6 pt-2 pb-4 flex justify-between items-center" data-purpose="app-header">
<!-- App Logo & Title -->
<div class="flex items-center space-x-2">
<!-- Blue SignTalk Hand Icon -->
<div class="w-8 h-8 rounded-full bg-primaryBlue flex items-center justify-center shadow-sm">
<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
<path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path>
<path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
<path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path>
</svg>
</div>
<span class="text-[20px] font-bold text-primaryText tracking-tight">SignTalk</span>
</div>
<!-- Profile Button -->
<button aria-label="User Profile" class="w-9 h-9 rounded-full bg-white border border-cardBorder flex items-center justify-center text-primaryText hover:bg-gray-50 transition-colors shadow-sm" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
<circle cx="12" cy="7" r="4"></circle>
</svg>
</button>
</header>
<!-- END: Header -->
<!-- BEGIN: HeroTitle -->
<section class="px-6 pt-3 pb-5" data-purpose="hero-title-section">
<h1 class="text-[24px] font-bold text-primaryText leading-[1.25] tracking-tight">
          Communication,<br>without barriers.
        </h1>
<p class="text-[14px] text-secondaryText mt-1.5 font-normal">
          Choose how you'd like to connect today.
        </p>
</section>
<!-- END: HeroTitle -->
<!-- BEGIN: ActionCards -->
<section class="px-6 space-y-3.5" data-purpose="main-action-cards">
<!-- Sign to Text Card -->
<button class="w-full bg-white rounded-2xl p-4 border border-cardBorder shadow-card flex items-center justify-between text-left transition-all active:scale-[0.99] hover:border-gray-300" type="button">
<div class="flex items-center space-x-3.5">
<!-- Icon -->
<div class="w-12 h-12 rounded-xl bg-primaryBlue flex items-center justify-center flex-shrink-0 text-white shadow-sm">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
<path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path>
<path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
<path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path>
</svg>
</div>
<!-- Text Content -->
<div>
<h2 class="text-[16px] font-bold text-primaryText leading-snug">Sign to Text</h2>
<p class="text-[13px] text-secondaryText mt-0.5">Translate ISL gestures<br>into text.</p>
</div>
</div>
<!-- Chevron -->
<svg class="w-5 h-5 text-gray-400 flex-shrink-0 mr-1" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</button>
<!-- Speech to Text Card -->
<button class="w-full bg-white rounded-2xl p-4 border border-cardBorder shadow-card flex items-center justify-between text-left transition-all active:scale-[0.99] hover:border-gray-300" type="button">
<div class="flex items-center space-x-3.5">
<!-- Icon -->
<div class="w-12 h-12 rounded-xl bg-iconPurpleBg flex items-center justify-center flex-shrink-0 text-iconPurple shadow-sm">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
<line x1="12" x2="12" y1="19" y2="22"></line>
</svg>
</div>
<!-- Text Content -->
<div>
<h2 class="text-[16px] font-bold text-primaryText leading-snug">Speech to Text</h2>
<p class="text-[13px] text-secondaryText mt-0.5">Turn spoken words<br>into readable captions.</p>
</div>
</div>
<!-- Chevron -->
<svg class="w-5 h-5 text-gray-400 flex-shrink-0 mr-1" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</button>
<!-- Start a Conversation Bar -->
<button class="w-full bg-white rounded-xl py-3 px-4 border border-cardBorder shadow-card flex items-center justify-between transition-all active:scale-[0.99] hover:border-gray-300" type="button">
<div class="flex items-center space-x-3">
<div class="w-7 h-7 rounded-full bg-blue-50 flex items-center justify-center text-primaryBlue">
<svg class="w-4 h-4 fill-primaryBlue" viewBox="0 0 24 24">
<path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"></path>
</svg>
</div>
<span class="text-[14px] font-bold text-primaryText">Start a Conversation</span>
</div>
<svg class="w-4 h-4 text-primaryBlue flex-shrink-0 mr-1" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</button>
</section>
<!-- END: ActionCards -->
<!-- BEGIN: RecentActivitySection -->
<section class="px-6 mt-6" data-purpose="recent-activity-section">
<!-- Section Header -->
<div class="flex justify-between items-center mb-3">
<h3 class="text-[15px] font-bold text-primaryText">Recent Activity</h3>
<a class="text-[13px] font-medium text-primaryBlue hover:underline" href="#">View all</a>
</div>
<!-- Activity List -->
<div class="bg-white rounded-2xl border border-cardBorder shadow-card divide-y divide-gray-100 overflow-hidden">
<!-- Activity Item 1: Hello -->
<div class="p-3.5 flex items-center justify-between hover:bg-gray-50 transition-colors cursor-pointer">
<div class="flex items-center space-x-3">
<div class="w-9 h-9 rounded-full bg-primaryBlue flex items-center justify-center text-white flex-shrink-0">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
<path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path>
<path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
<path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path>
</svg>
</div>
<div>
<p class="text-[14px] font-semibold text-primaryText leading-tight">Hello</p>
<p class="text-[12px] text-secondaryText mt-0.5">Sign to Text • 2 mins ago</p>
</div>
</div>
<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</div>
<!-- Activity Item 2: How are you? -->
<div class="p-3.5 flex items-center justify-between hover:bg-gray-50 transition-colors cursor-pointer">
<div class="flex items-center space-x-3">
<div class="w-9 h-9 rounded-full bg-iconPurpleBg flex items-center justify-center text-iconPurple flex-shrink-0">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
<line x1="12" x2="12" y1="19" y2="22"></line>
</svg>
</div>
<div>
<p class="text-[14px] font-semibold text-primaryText leading-tight">How are you?</p>
<p class="text-[12px] text-secondaryText mt-0.5">Speech to Text • 15 mins ago</p>
</div>
</div>
<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</div>
</div>
</section>
<!-- END: RecentActivitySection -->
</div>
<!-- BEGIN: BottomNavigation -->
<nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-cardBorder py-2 px-4 flex justify-around items-center z-10 pb-5" data-purpose="tab-navigation">
<!-- Tab 1: Home (Active) -->
<button class="flex flex-col items-center justify-center w-16 text-primaryBlue focus:outline-none" type="button">
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
<path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
</svg>
<span class="text-[10px] font-semibold mt-1">Home</span>
</button>
<!-- Tab 2: Translate -->
<button class="flex flex-col items-center justify-center w-16 text-secondaryText hover:text-primaryText focus:outline-none" type="button">
<svg class="w-5 h-5 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<rect height="8" rx="2" width="8" x="2" y="4"></rect>
<path d="M14 4h6a2 2 0 0 1 2 2v2"></path>
<path d="M14 20h6a2 2 0 0 0 2-2v-2"></path>
<rect height="6" rx="2" width="8" x="2" y="14"></rect>
</svg>
<span class="text-[10px] font-medium mt-1">Translate</span>
</button>
<!-- Tab 3: Conversations -->
<button class="flex flex-col items-center justify-center w-16 text-secondaryText hover:text-primaryText focus:outline-none" type="button">
<svg class="w-5 h-5 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
</svg>
<span class="text-[10px] font-medium mt-1">Conversations</span>
</button>
<!-- Tab 4: Settings -->
<button class="flex flex-col items-center justify-center w-16 text-secondaryText hover:text-primaryText focus:outline-none" type="button">
<svg class="w-5 h-5 stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="3"></circle>
<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
</svg>
<span class="text-[10px] font-medium mt-1">Settings</span>
</button>
</nav>
<!-- END: BottomNavigation -->
</main>
<!-- END: MobileFrame -->
</body></html>
