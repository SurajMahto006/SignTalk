<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>SignTalk - Conversations</title>
<!-- Tailwind CSS v3 with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Font: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#007AFF',
              dark: '#1D1D1F',
              secondary: '#6E6E73',
              border: '#E5E5EA',
              bg: '#F5F5F7',
              card: '#FFFFFF',
              tintBlue: '#EDF5FF',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    body {
      background-color: #E8ECEF;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Hide scrollbars while retaining scrollability */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 md:p-6 text-brand-dark">
<!-- BEGIN: PhoneContainer -->
<div class="w-full max-w-[393px] h-[852px] bg-brand-bg md:rounded-[48px] shadow-2xl flex flex-col relative overflow-hidden border border-brand-border" data-purpose="mobile-frame">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full pt-3 px-7 pb-2 flex justify-between items-center z-20 shrink-0 select-none bg-brand-bg" data-purpose="status-bar">
<span class="text-[15px] font-semibold tracking-tight text-brand-dark">9:41</span>
<!-- Right Status Icons: Cellular, Wi-Fi, Battery -->
<div class="flex items-center space-x-2 text-brand-dark">
<!-- Cellular Signal -->
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 17 12">
<rect height="3.5" rx="0.5" width="2.5" x="0" y="8.5"></rect>
<rect height="6" rx="0.5" width="2.5" x="4.5" y="6"></rect>
<rect height="9" rx="0.5" width="2.5" x="9" y="3"></rect>
<rect height="12" rx="0.5" width="2.5" x="13.5" y="0"></rect>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 16 12">
<path clip-rule="evenodd" d="M8 10a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-4.24-2.83a6 6 0 0 1 8.48 0 .75.75 0 1 0 1.06-1.06 7.5 7.5 0 0 0-10.6 0 .75.75 0 0 0 1.06 1.06zm-2.12-2.12a9 9 0 0 1 12.72 0 .75.75 0 1 0 1.06-1.06 10.5 10.5 0 0 0-14.84 0 .75.75 0 1 0 1.06 1.06z"></path>
</svg>
<!-- Battery Icon -->
<div class="flex items-center">
<div class="w-5 h-[11px] border border-brand-dark rounded-[3.5px] p-[1px] flex items-center">
<div class="w-full h-full bg-brand-dark rounded-[1.5px]"></div>
</div>
<div class="w-[1.5px] h-[4px] bg-brand-dark rounded-r-[1px] ml-[1px]"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: TopNavigationBar -->
<nav class="px-5 py-2.5 flex items-center justify-between z-10 shrink-0 bg-brand-bg" data-purpose="top-nav">
<!-- Back Button -->
<button aria-label="Go back" class="p-1 -ml-1 text-brand-dark hover:opacity-75 transition-opacity" type="button">
<svg class="w-6 h-6 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Center Title -->
<h1 class="text-[17px] font-bold text-brand-dark tracking-tight">Conversations</h1>
<!-- More Options Button -->
<button aria-label="More options" class="p-1 -mr-1 text-brand-dark hover:opacity-75 transition-opacity flex items-center justify-center" type="button">
<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
<circle cx="12" cy="5" r="1.75"></circle>
<circle cx="12" cy="12" r="1.75"></circle>
<circle cx="12" cy="19" r="1.75"></circle>
</svg>
</button>
</nav>
<!-- END: TopNavigationBar -->
<!-- BEGIN: ConversationContentArea -->
<main class="flex-1 overflow-y-auto px-4 pt-2 pb-3 space-y-4 no-scrollbar" data-purpose="chat-scroll-area">
<!-- Date Indicator Pill -->
<div class="flex justify-center my-1.5">
<span class="bg-white/80 border border-brand-border/70 text-brand-secondary text-[12px] font-medium px-3 py-1 rounded-full shadow-xs">
          Today, 14 Oct
        </span>
</div>
<!-- Bubble 1: You (Typed Text) -->
<div class="bg-white rounded-2xl p-4 shadow-sm border border-brand-border/60" data-purpose="message-bubble-user">
<span class="block text-[12px] font-medium text-brand-secondary mb-1.5">You (Typed Text)</span>
<p class="text-[14.5px] font-normal leading-relaxed text-brand-dark">Hello! How can I help you today?</p>
<div class="flex justify-end mt-2">
<span class="text-[11px] text-brand-secondary">10:24 AM</span>
</div>
</div>
<!-- Bubble 2: Recognized Sign -->
<div class="bg-brand-tintBlue rounded-2xl p-4 border border-[#D5E6FB] shadow-xs" data-purpose="message-bubble-recognized-sign">
<div class="flex items-start space-x-3">
<!-- Hand Gesture Sign Icon -->
<div class="w-10 h-10 rounded-full bg-brand-blue flex items-center justify-center text-white shrink-0 shadow-sm mt-0.5">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V4.5a1.5 1.5 0 113 0v5m0-2.5a1.5 1.5 0 013 0v3.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Message and Badge Content -->
<div class="flex-1">
<div class="inline-flex items-center space-x-1.5 mb-1.5">
<svg class="w-3.5 h-3.5 text-brand-blue" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="9"></circle>
<path d="M12 8v4m0 4h.01" stroke-linecap="round"></path>
</svg>
<span class="text-[12px] font-semibold text-brand-blue">Recognized Sign</span>
</div>
<p class="text-[14.5px] font-normal leading-snug text-brand-dark">Thank you for helping me find the platform.</p>
</div>
</div>
<!-- Timestamp with double tick -->
<div class="flex justify-end items-center space-x-1 mt-1.5">
<span class="text-[11px] text-brand-secondary">10:25 AM</span>
<svg class="w-3.5 h-3.5 text-brand-blue" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M4 12.5l4 4L18 6.5M9.5 12.5l2.5 2.5 7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Bubble 3: Spoken Text -->
<div class="bg-white rounded-2xl p-4 shadow-sm border border-brand-border/60" data-purpose="message-bubble-spoken-text">
<div class="flex items-start space-x-3">
<!-- Mic circular avatar -->
<div class="w-10 h-10 rounded-full bg-brand-tintBlue text-brand-blue flex items-center justify-center shrink-0 mt-0.5">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 003-3V5a3 3 0 10-6 0v6a3 3 0 003 3z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Message Content -->
<div class="flex-1">
<div class="inline-flex items-center space-x-1.5 mb-1.5">
<svg class="w-3.5 h-3.5 text-brand-blue" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[12px] font-semibold text-brand-blue">Spoken Text</span>
</div>
<p class="text-[14.5px] font-normal leading-snug text-brand-dark">That's great!</p>
</div>
</div>
<!-- Timestamp -->
<div class="flex justify-end mt-1">
<span class="text-[11px] text-brand-secondary">10:26 AM</span>
</div>
</div>
</main>
<!-- END: ConversationContentArea -->
<!-- BEGIN: QuickActionsAndComposer -->
<div class="px-4 pb-2 pt-1 bg-brand-bg space-y-3 shrink-0" data-purpose="input-section">
<!-- Input Mode Quick Action Pills -->
<div class="grid grid-cols-3 gap-2.5" data-purpose="mode-pills-row">
<!-- Type Pill -->
<button class="flex items-center justify-center space-x-2 py-2.5 px-3 bg-white border border-brand-border/80 rounded-2xl shadow-xs text-brand-secondary hover:text-brand-dark transition-colors" type="button">
<!-- Keyboard Icon -->
<svg class="w-5 h-5 text-brand-blue" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<rect height="14" rx="2.5" width="18" x="3" y="5"></rect>
<path d="M7 9h.01M10 9h.01M13 9h.01M16 9h.01M7 12h.01M10 12h.01M13 12h.01M16 12h.01M9 15h6" stroke-linecap="round"></path>
</svg>
<span class="text-[13px] font-medium text-brand-dark">Type</span>
</button>
<!-- Speak Pill -->
<button class="flex items-center justify-center space-x-2 py-2.5 px-3 bg-white border border-brand-border/80 rounded-2xl shadow-xs text-brand-secondary hover:text-brand-dark transition-colors" type="button">
<!-- Microphone Icon -->
<svg class="w-5 h-5 text-brand-blue" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M19 10v1a7 7 0 01-14 0v-1M12 18v4m-4 0h8" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[13px] font-medium text-brand-dark">Speak</span>
</button>
<!-- Translate Pill -->
<button class="flex items-center justify-center space-x-2 py-2.5 px-3 bg-white border border-brand-border/80 rounded-2xl shadow-xs text-brand-secondary hover:text-brand-dark transition-colors" type="button">
<!-- Translate / Sliders Icon -->
<svg class="w-5 h-5 text-brand-blue" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M3 7h11M18 7h3M9 7a2 2 0 104 0 2 2 0 00-4 0zM3 17h4M11 17h10M7 17a2 2 0 11-4 0 2 2 0 014 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[13px] font-medium text-brand-dark">Translate</span>
</button>
</div>
<!-- Message Composer Bar -->
<form class="flex items-center space-x-2.5 pt-0.5" data-purpose="chat-composer" onsubmit="event.preventDefault();">
<div class="relative flex-1">
<input class="w-full bg-white border border-brand-border rounded-full pl-5 pr-4 py-3 text-[14.5px] text-brand-dark placeholder-brand-secondary/70 focus:outline-none focus:ring-1 focus:ring-brand-blue focus:border-brand-blue transition-all" placeholder="Type a message..." type="text">
</div>
<!-- Circular Blue Send Button -->
<button aria-label="Send Message" class="w-12 h-12 rounded-full bg-brand-blue text-white flex items-center justify-center shadow-md hover:bg-blue-600 transition-colors shrink-0" type="submit">
<svg class="w-5 h-5 stroke-[2.5] ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</form>
</div>
<!-- END: QuickActionsAndComposer -->
<!-- BEGIN: BottomNavigation -->
<footer class="w-full bg-white border-t border-brand-border px-4 pt-2.5 pb-6 flex justify-around items-center z-10 shrink-0" data-purpose="bottom-tab-bar">
<!-- Home Tab -->
<a class="flex flex-col items-center group cursor-pointer" href="#">
<svg class="w-6 h-6 text-brand-secondary group-hover:text-brand-dark transition-colors" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10.5px] mt-1 font-medium text-brand-secondary group-hover:text-brand-dark transition-colors">Home</span>
</a>
<!-- Translate Tab -->
<a class="flex flex-col items-center group cursor-pointer" href="#">
<svg class="w-6 h-6 text-brand-secondary group-hover:text-brand-dark transition-colors" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<rect height="6" rx="1.5" width="6" x="4" y="4"></rect>
<rect height="6" rx="1.5" width="6" x="14" y="4"></rect>
<rect height="6" rx="1.5" width="6" x="4" y="14"></rect>
<circle cx="17" cy="17" r="3"></circle>
</svg>
<span class="text-[10.5px] mt-1 font-medium text-brand-secondary group-hover:text-brand-dark transition-colors">Translate</span>
</a>
<!-- Conversations Tab (Active) -->
<a class="flex flex-col items-center cursor-pointer" href="#">
<div class="relative">
<svg class="w-6 h-6 text-brand-blue" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="absolute -top-0.5 -right-0.5 w-2 h-2 bg-brand-blue rounded-full"></span>
</div>
<span class="text-[10.5px] mt-1 font-semibold text-brand-blue">Conversations</span>
</a>
<!-- Settings Tab -->
<a class="flex flex-col items-center group cursor-pointer" href="#">
<svg class="w-6 h-6 text-brand-secondary group-hover:text-brand-dark transition-colors" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="12" cy="12" r="3"></circle>
</svg>
<span class="text-[10.5px] mt-1 font-medium text-brand-secondary group-hover:text-brand-dark transition-colors">Settings</span>
</a>
</footer>
<!-- END: BottomNavigation -->
</div>
<!-- END: PhoneContainer -->
</body></html>
